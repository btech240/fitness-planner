{# Page header: big condensed title, optional mono meta on the right, Miami stripe. #}
<header class="page-head">
  <div class="title-row">
    <h1>{{ head_title }}</h1>
    {% if head_meta %}<span class="meta">{{ head_meta }}</span>{% endif %}
  </div>
  <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>
</header>
